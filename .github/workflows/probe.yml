name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q libfribidi0 libraqm0 || true
      - run: pip install pillow
      - env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          src=open("run.py",encoding="utf-8").read()
          g={"__file__":__import__("os").path.abspath("run.py"),"__name__":"probe"}
          exec(src[:src.index("# --- Telegram channels")].replace('if os.environ.get("BACKFILL")','if False'), g)
          open("out.jpg","wb").write(g["cover"]("استراتژی فول فانل بلک فرایدی برای فروشگاه اینترنتی + نقشه راه افزایش فروش"))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: out, path: out.jpg}
