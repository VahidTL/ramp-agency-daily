name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q libfribidi0 libraqm0 || true
      - run: pip install pillow
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BLOG_INGEST_TOKEN: ${{ secrets.BLOG_INGEST_TOKEN }}
          BLOG_URL: https://rampagency.org/ingest/posts
          OWNER_CHAT_ID: "43391749"
        run: |
          python3 - <<'PY2'
          src=open("run.py",encoding="utf-8").read()
          g={"__file__":__import__("os").path.abspath("run.py"),"__name__":"probe"}
          exec(src[:src.index("# --- Telegram channels")].replace('if os.environ.get("BACKFILL")','if False'), g)
          name,url=next(iter(g["RSS"].items()))
          key,text,_=g["rss_items"](url)[0]
          print("ITEM",key)
          g["blog_draft"](text,name,key,g["cover"](text))
          print("DONE")
          PY2
