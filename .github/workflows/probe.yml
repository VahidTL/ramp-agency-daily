name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q libfribidi0 libraqm0 || true
      - run: pip install pillow
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BLOG_INGEST_TOKEN: ${{ secrets.BLOG_INGEST_TOKEN }}
          BLOG_URL: https://rampagency.org/ingest/posts
          OWNER_CHAT_ID: "43391749"
        run: |
          python3 - <<'PY'
          src=open("run.py",encoding="utf-8").read()
          g={"__file__":__import__("os").path.abspath("run.py"),"__name__":"probe"}
          exec(src[:src.index("# --- Telegram channels")].replace('if os.environ.get("BACKFILL")','if False'), g)
          want=["how-to-optimize-google-ads-campaigns-when-conversion-volume-is-low","google-ads-lead-quality-tracking-how-to-send-crm-outcomes-back-to-the-right-keyword"]
          for key,text,_ in g["rss_items"](g["RSS"]["dynares"]):
              if any(key.endswith(w) for w in want):
                  print("REDO",key); g["blog_draft"](text,"dynares",key)
          PY
