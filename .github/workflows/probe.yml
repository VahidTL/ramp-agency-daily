name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          k=os.environ["K"]; b="https://generativelanguage.googleapis.com/v1beta/models"
          ms=json.load(urllib.request.urlopen(urllib.request.Request(b+"?pageSize=200",headers={"x-goog-api-key":k})))["models"]
          imgs=[m for m in ms if any(w in m["name"] for w in ("image","imagen"))]
          for m in imgs:
              n=m["name"]; meth=m.get("supportedGenerationMethods",[]); print(n,meth)
              try:
                  if "generateContent" in meth:
                      body={"contents":[{"parts":[{"text":"a cargo ship at sunset"}]}],"generationConfig":{"responseModalities":["IMAGE"]}}; u=f"{b}/{n.split('/')[1]}:generateContent"
                  else:
                      body={"instances":[{"prompt":"a cargo ship at sunset"}],"parameters":{"sampleCount":1}}; u=f"{b}/{n.split('/')[1]}:predict"
                  r=urllib.request.urlopen(urllib.request.Request(u,json.dumps(body).encode(),{"x-goog-api-key":k,"content-type":"application/json"}),timeout=90).read()
                  print("  OK",len(r))
              except urllib.error.HTTPError as e: print("  HTTP",e.code,e.read()[:160])
              except Exception as e: print("  ERR",e)
          PY
